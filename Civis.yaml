name: refreshing_nicolas
services:
  client:
    cpu_shares: 90
    container_name: civis-client
    depends_on:
      server:
        condition: service_started
        required: true
    deploy:
      resources:
        limits:
          memory: 16562192384
    image: jucraft0/civis-client:latest
    labels:
      icon: https://raw.githubusercontent.com/JuCraft0/Civis/main/client/public/logo.png
    ports:
      - target: 10000
        published: "10001"
        protocol: tcp
    restart: unless-stopped
    networks:
      - civis-net

  server:
    cpu_shares: 90
    container_name: civis-server
    depends_on:
      db:
        condition: service_started
        required: true
    deploy:
      resources:
        limits:
          memory: 16562192384
    environment:
      - DATABASE_URL=postgres://civis:civis@db:5432/civis
      - NODE_ENV=production
      - PORT=5005
    image: jucraft0/civis-server:latest
    labels:
      icon: https://raw.githubusercontent.com/JuCraft0/Civis/main/client/public/logo.png
    restart: unless-stopped
    networks:
      - civis-net

  db:
    image: postgres:15-alpine
    container_name: civis-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=civis
      - POSTGRES_PASSWORD=civis
      - POSTGRES_DB=civis
    volumes:
      - /DATA/AppData/civis/postgres:/var/lib/postgresql/data
    networks:
      - civis-net

networks:
  civis-net:
    name: refreshing_nicolas_civis-net
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  author: JuCraft0
  category: Utilities
  description:
    de_de: Personenverwaltung mit Gesichtserkennung.
    en_us: People management application with face recognition.
  hostname: ""
  icon: https://raw.githubusercontent.com/JuCraft0/Civis/main/client/public/logo.png
  index: /
  is_uncontrolled: false
  main: client
  port_map: "10001"
  scheme: http
  store_app_id: refreshing_nicolas
  title:
    custom: ""
    de_de: Civis
    en_us: Civis
